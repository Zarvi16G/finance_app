        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/currencies/convert/:
    post:
      operationId: currencies_convert_create
      description: Converts {amount, from, to}. `to` defaults to the caller's base
        currency. Rates come from the daily cache, not a live call.
      tags:
      - currencies
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
