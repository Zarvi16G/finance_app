components:
  schemas:
    AccountBankEnum:
      enum:
      - credit_card
      - debit_card
      - cash_loan
      - bank_loan
      - cash
      - business_card
      - bre_b
      - other
      type: string
      description: |-
        * `credit_card` - Credit Card
        * `debit_card` - Debit Card
        * `cash_loan` - Cash Loan
        * `bank_loan` - Bank Loan
        * `cash` - Cash
        * `business_card` - Business Card
        * `bre_b` - Bre-B (Employee Special Card)
        * `other` - Other
    Asset:
      type: object
      description: Serializer for owned assets.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        asset_type:
          $ref: '#/components/schemas/AssetTypeEnum'
        asset_type_display:
          type: string
          readOnly: true
        current_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          type: string
          description: ISO 4217 code the value above is expressed in
          maxLength: 3
        is_liquid:
          type: boolean
          description: Convertible to cash within days; drives the emergency-fund
            metrics
        valued_at:
          type: string
          format: date
          nullable: true
          description: When this valuation was taken — a stale one quietly distorts
            net worth
        acquired_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_type_display
      - created_at
      - current_value
      - id
      - name
      - updated_at
    AssetRequest:
      type: object
      description: Serializer for owned assets.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        asset_type:
          $ref: '#/components/schemas/AssetTypeEnum'
        current_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,16}(?:\.\d{0,2})?$
        currency:
          type: string
          minLength: 1
          description: ISO 4217 code the value above is expressed in
          maxLength: 3
        is_liquid:
          type: boolean
          description: Convertible to cash within days; drives the emergency-fund
            metrics
        valued_at:
          type: string
          format: date
          nullable: true
          description: When this valuation was taken — a stale one quietly distorts
            net worth
        acquired_date:
          type: string
          format: date
          nullable: true
        notes:
          type: string
          nullable: true
      required:
      - current_value
      - name
    AssetTypeEnum:
      enum:
      - cash
      - savings
      - investment
      - retirement
      - property
      - vehicle
      - business
      - receivable
      - other
      type: string
      description: |-
        * `cash` - Cash
        * `savings` - Savings Account
        * `investment` - Investment
        * `retirement` - Retirement Fund
        * `property` - Property
        * `vehicle` - Vehicle
        * `business` - Business Stake
        * `receivable` - Money Owed to Me
        * `other` - Other
    BankStatement:
      type: object
      description: Serializer for uploaded bank statements.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        file:
          type: string
          format: uri
        original_filename:
          type: string
          maxLength: 255
        file_size_mb:
          type: number
          format: double
          readOnly: true
        content_hash:
          type: string
          readOnly: true
          nullable: true
          description: SHA256 hash of file content for duplicate detection
        statement_type:
          allOf:
          - $ref: '#/components/schemas/StatementTypeEnum'
          description: |-
            Type of statement: savings, checking, credit_card, etc.

            * `savings` - Savings Account
            * `checking` - Checking Account
            * `credit_card` - Credit Card
            * `loan` - Loan Statement
            * `investment` - Investment Account
            * `other` - Other
        statement_type_display:
          type: string
          readOnly: true
        bank_name:
          type: string
          maxLength: 100
        account_number:
          type: string
          maxLength: 50
        statement_period_start:
          type: string
          format: date
          nullable: true
        statement_period_end:
          type: string
          format: date
          nullable: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        processed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/BankStatementStatusEnum'
          readOnly: true
        status_display:
          type: string
          readOnly: true
        total_transactions_extracted:
          type: integer
          readOnly: true
        total_transactions_imported:
          type: integer
          readOnly: true
        error_message:
          type: string
          readOnly: true
          nullable: true
      required:
      - content_hash
      - error_message
      - file
      - file_size_mb
      - id
      - original_filename
      - processed_at
      - statement_type_display
      - status
      - status_display
      - total_transactions_extracted
      - total_transactions_imported
      - uploaded_at
    BankStatementRequest:
      type: object
      description: Serializer for uploaded bank statements.
      properties:
        file:
          type: string
          format: binary
        original_filename:
          type: string
          minLength: 1
          maxLength: 255
        statement_type:
          allOf:
          - $ref: '#/components/schemas/StatementTypeEnum'
          description: |-
