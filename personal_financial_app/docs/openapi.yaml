openapi: 3.0.3
info:
  title: Personal Finance API
  version: 1.0.0
  description: 'REST API for the Personal Financial App: financial records, bank statement
    PDF extraction, debts, goals, analytics snapshots, exports, and AI-powered analysis,
    categorization and chat (Gemini / OpenAI / Anthropic).'
paths:
  /api/ai-categorize/:
    post:
      operationId: ai_categorize_create
      description: Suggest AI categories for transactions based on their descriptions.
      tags:
      - ai-categorize
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai-chat/:
    post:
      operationId: ai_chat_create
      description: Conversational AI assistant for transaction management. Falls back
        to a rule engine when offline.
      tags:
      - ai-chat
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/ai-settings/:
    get:
      operationId: ai_settings_retrieve
      description: Returns the public AI config (provider, model, masked keys only).
      tags:
      - ai-settings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: ai_settings_update
      description: Accepts {provider?, model?, api_key?}. An api_key is validated
        live against the provider before being stored encrypted.
      tags:
      - ai-settings
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analysis/:
    post:
      operationId: analysis_create
      description: Runs a smart financial analysis over the filtered records and goals,
        returning an executive health audit, budget leak analysis and actionable steps.
      tags:
      - analysis
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analytics/:
    get:
      operationId: analytics_retrieve
      description: Comprehensive dashboard data (stat tiles, charts, health ratios,
        debt summary) for the date range given by start_date / end_date (YYYY-MM-DD).
        Serves from pre-computed FinancialSnapshot when available, otherwise computes
        live.
      tags:
      - analytics
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assets/:
    get:
      operationId: assets_list
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Asset'
          description: ''
    post:
      operationId: assets_create
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/:
    get:
      operationId: assets_retrieve
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    put:
      operationId: assets_update
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: assets_partial_update
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    delete:
      operationId: assets_destroy
      description: |-
        CRUD for the things a user owns: cash, investments, property, vehicles.
        Debts are the other side of the ledger and live at /api/debts/.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this asset.
        required: true
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/auth/2fa/verify/:
    post:
      operationId: auth_2fa_verify_create
      description: Second step of login for accounts with 2FA. Exchanges {mfa_token,
        code} for the JWT pair. `code` accepts a TOTP code or one of the single-use
        backup codes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Exchanges username + password for a JWT pair and the user profile.
      tags:
