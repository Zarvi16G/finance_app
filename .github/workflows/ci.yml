name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_financial_app/backend

    env:
      # Never the production key: CI only needs a stable, long-enough value so
      # Django boots and the deployment checks stay quiet.
      DJANGO_SECRET_KEY: ci-only-value-not-a-real-secret-8f3b1c9d2e4a6057
      DJANGO_DEBUG: 'false'
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: personal_financial_app/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check models and migrations are in sync
        # Catches a model edited without its migration, which would then fail
        # on somebody else's machine instead of here.
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests
        run: python manage.py test

      - name: Django deployment checks
        # Reports missing production hardening (HSTS, secure cookies, DEBUG).
        run: python manage.py check --deploy --fail-level ERROR

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: personal_financial_app/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: personal_financial_app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
